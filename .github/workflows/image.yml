name: image

on:
  workflow_dispatch:
  push:
    branches: [mainline]
    tags: ["v*"] # path filters do not apply to tags
    paths:
      - cmd/broker/**
      - internal/**
      - go.mod
      - go.sum
      - Dockerfile.*
      - .dockerignore
      - .github/workflows/image.yml
  pull_request:
    branches: [mainline]
    paths:
      - cmd/broker/**
      - internal/**
      - go.mod
      - go.sum
      - Dockerfile.*
      - .dockerignore
      - .github/workflows/image.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        component: [broker, frps]
    env:
      IMAGE: ghcr.io/layertwo/tunnels-${{ matrix.component }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the broker binaries
        if: matrix.component == 'broker'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - if: matrix.component == 'broker'
        run: |
          version=${GITHUB_REF_NAME}
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version=${GITHUB_SHA::7}
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags "-s -w -X main.version=$version" -o dist/broker-linux-$a ./cmd/broker
          done

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Smoke test (pull requests)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          load: true
          tags: smoke:${{ matrix.component }}
      - if: env.PUBLISH != 'true'
        run: |
          out=$(docker run --rm smoke:${{ matrix.component }} --version)
          echo "$out"
          case "${{ matrix.component }}" in
            frps) test "$out" = "0.71.0" ;;
            broker) test "$out" = "${GITHUB_SHA::7}" ;;
          esac

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Sign by digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
