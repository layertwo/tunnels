name: ci

on:
  pull_request:
  push:
    branches: [mainline]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet -tags e2e ./... # the tag adds the e2e package and changes no other

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # no plain postgres image exists on ghcr; this is the ECR Public mirror of the official image
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: code-coverage
          path: coverage.txt

  # Posts the coverage report of `test` as a comment on the pull request; the
  # profile uploaded on mainline is the baseline it compares against.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      actions: read # download the baseline coverage artifact
      pull-requests: write # post or update the comment
    steps:
      - uses: fgrosse/go-coverage-report@c4bf7e78d1379325814b4dd42d80e526082e788b # v1.5.0

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      # Builds frps from the pinned module, then runs it with the broker and the CLI's frp client.
      # No -race: frp v0.71.0's client reads Service.ctl without its lock in keepControllerWorking
      # (client/service.go:278) while stop() writes it (:438), and the race detector reports that
      # now and then. Our own code runs under -race in the test job.
      - run: go test -tags e2e ./e2e/ -timeout 10m -v

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=publish
      - name: Seven archives and the checksums
        run: |
          ls dist/*.tar.gz dist/*.zip
          test "$(ls dist/*.tar.gz dist/*.zip | wc -l)" -eq 7
          test -s dist/checksums.txt

  vuln:
    runs-on: ubuntu-latest
    steps:
      # the action checks out the repository itself
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: '1.27'
          go-package: './...'
