name: ci

on:
  pull_request:
  push:
    branches: [mainline]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - run: go test -race ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      # the action checks out the repository itself
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26'
          go-package: './...'
